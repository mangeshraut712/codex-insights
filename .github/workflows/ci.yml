name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install official plugin validator deps
        run: |
          python3 -m pip install --user --upgrade 'pip>=26.2.2'
          python3 -m pip install --user pyyaml
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
      - run: python3 -B -m unittest discover -s scripts -p "test_adoption.py"

  tester-army:
    env:
      E2E_TELEMETRY_DISABLED: "1"
    name: Synthetic CLI and report journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tester-army
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tester-army-report
          path: .e2e/
          include-hidden-files: true
