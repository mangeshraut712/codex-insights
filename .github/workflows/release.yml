name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: Install official plugin validator deps
        run: python3 -m pip install --user pyyaml
      - run: npm test
      - run: npm run check
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          if npm view "@mangeshraut712/codex-insights@${version}" version >/dev/null 2>&1; then
            echo "Version ${version} is already on npm."
            exit 0
          fi
          npm publish --access public --provenance
